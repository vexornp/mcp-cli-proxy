name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: tar -czf mcp-cli-proxy-${{ matrix.target }}.tar.gz -C target/release mcp-cli-proxy
      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 mcp-cli-proxy-${{ matrix.target }}.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-cli-proxy-${{ matrix.target }}.tar.gz
      - name: Print SHA256
        run: |
          echo "::notice::SHA256 for ${{ matrix.target }}: ${{ steps.sha.outputs.sha256 }}"
          echo "SHA256 for ${{ matrix.target }}: ${{ steps.sha.outputs.sha256 }}"
