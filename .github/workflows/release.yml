name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: tar -czf mcp-cli-proxy-${{ matrix.target }}.tar.gz -C target/release mcp-cli-proxy
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-cli-proxy-${{ matrix.target }}.tar.gz

  publish-formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and compute SHA256
        id: sha
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern "mcp-cli-proxy-*.tar.gz" --dir .
          ARM_SHA=$(sha256sum mcp-cli-proxy-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum mcp-cli-proxy-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          echo "arm_sha256=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "intel_sha256=$INTEL_SHA" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout mcp-cli-proxy (for formula template)
        uses: actions/checkout@v4

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: vexornp/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Generate and push formula
        env:
          TAG: ${{ github.ref_name }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha256 }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha256 }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p homebrew-tap/Formula
          sed \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@TAG@|$TAG|g" \
            -e "s|@ARM_SHA@|$ARM_SHA|g" \
            -e "s|@INTEL_SHA@|$INTEL_SHA|g" \
            Formula/mcp-cli-proxy.rb.template > homebrew-tap/Formula/mcp-cli-proxy.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mcp-cli-proxy.rb
          git diff --staged --quiet || {
            git commit -m "Update mcp-cli-proxy to $TAG"
            git push
          }
